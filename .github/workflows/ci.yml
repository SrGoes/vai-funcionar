name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Lints already present in the code that came with the trustno1 base
  # (64d4931). They are allowed here instead of fixed in place, so updating
  # the base never conflicts with our edits. Any other warning still fails.
  # Remove a name once the base no longer has it.
  UPSTREAM_LINTS: >-
    -A clippy::blocks_in_conditions
    -A clippy::cloned_ref_to_slice_refs
    -A clippy::if_same_then_else
    -A clippy::items_after_test_module
    -A clippy::large_enum_variant
    -A clippy::manual_is_multiple_of
    -A clippy::mem_replace_with_default
    -A clippy::missing_transmute_annotations
    -A clippy::needless_borrow
    -A clippy::precedence
    -A clippy::too_many_arguments
    -A clippy::unnecessary_cast
    -A clippy::unnecessary_get_then_check
    -A clippy::unnecessary_sort_by
    -A clippy::unusual_byte_groupings
    -A clippy::wrong_self_convention
    -A dead_code
    -A dropping_copy_types
    -A unexpected_cfgs
    -A unused_assignments
    -A unused_variables

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      # The version and components pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings ${{ env.UPSTREAM_LINTS }}
      - name: Clippy, diagnostics build
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings ${{ env.UPSTREAM_LINTS }}
      # Includes xtask's repository_passes_policy, the asset-policy check.
      - name: Tests
        run: cargo test --workspace --locked
